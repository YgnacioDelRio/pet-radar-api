services:
  migrations:
    image: haloygnacio777/pet-radar-api:latest
    container_name: PetRadarMigrator
    environment:
      - MAILER_SERVICE=${MAILER_SERVICE}
      - MAILER_USER=${MAILER_USER}
      - MAILER_TOKEN=${MAILER_TOKEN}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - AWS_BUCKET=${AWS_BUCKET}
      - AWS_REGION=${AWS_REGION}

    command: ["npm","run","migration:run"]
    depends_on:
      postgres:
        condition: service_healthy

  pet-radar-api:
    image: pet-radar-api:latest
    container_name: PetRadarApi
    port:
      - 3000:3000
    envirorment:
      - MAILER_SERVICE=${MAILER_SERVICE}
      - MAILER_USER=${MAILER_USER}
      - MAILER_TOKEN=${MAILER_TOKEN}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_TYPE=${DB_TYPE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      - migrations

  postgres:
    image: postgis/postgis:16-master
    container_name: 512-petradar-db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data_db:/var/lib/postgresql
 
  redis:
    image: redis
    container_name: 512-petradar-redis
    ports:
      - 6379:6379
    volumes:
      - redis_data_db:/data
      # Bind Volumes mapear una carpeta del server con el contenedor
 
volumes:
  postgres_data_db:
  redis_data_db: