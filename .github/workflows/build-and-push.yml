name: Build and push docker iamge

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v7

      - name: Docker login
        run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir la imagen de docker
        run: docker build -t haloygnacio777/pet-radar-api:latest .
      
      - name: Publicar imagen en Docker Hub
        run: docker push -it haloygnacio777/pet-radar-api:latest