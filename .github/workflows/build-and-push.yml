name: Build and push docker iamge

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v7

      - name: Docker login
        run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir la imagen de docker
        run: docker build -t haloygnacio777/pet-radar-api:latest .
      
      - name: Publicar imagen en Docker Hub
        run: docker push haloygnacio777/pet-radar-api:latest
  
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connect SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }} # la ip publica ??
          username: ${{ secrets.USER}} # ubuntu
          key: ${{ secrets.KEY}} # la key del terraform, ctrl + a
          script:
            sudo docker pull haloygnacio777/pet-radar-api:latest
            cd /containers/pet-radar-api
            sudo docker compose up -d